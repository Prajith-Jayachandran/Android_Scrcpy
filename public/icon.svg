<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Phone Border Glow Gradient -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Screen Glass Glow -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filter for soft ambient glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="url(#neon-cyan)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Ambient Glow Behind Phone -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Phone Chassis (Futuristic Hardware) -->
  <rect x="156" y="86" width="200" height="340" rx="36" fill="url(#glass-grad)" stroke="url(#neon-cyan)" stroke-width="5" filter="url(#glow)"/>

  <!-- Inner Phone Screen Display -->
  <rect x="168" y="104" width="176" height="304" rx="24" fill="#030712"/>

  <!-- Camera Punchhole Notch -->
  <circle cx="256" cy="120" r="4.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Holographic Screen Waves / Aether Mirroring Symbol -->
  <!-- Upper Mirror Wave -->
  <path d="M 200 190 Q 256 160 312 190" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Middle Mirror Wave -->
  <path d="M 216 220 Q 256 195 296 220" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- Lower Mirror Wave -->
  <path d="M 232 250 Q 256 230 280 250" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Center Screen Holographic Device Core (Glowing Screen Cast Hexagon/Icon) -->
  <circle cx="256" cy="290" r="16" fill="url(#neon-cyan)" filter="url(#glow)"/>
  <circle cx="256" cy="290" r="8" fill="#ffffff"/>

  <!-- Futuristic Display Bottom Home Pill Bar -->
  <rect x="226" y="392" width="60" height="4.5" rx="2.25" fill="#94a3b8" opacity="0.8"/>

  <!-- Speed / Wireless Rays Casting Off Canvas (Ultra-Low Latency Symbol) -->
  <path d="M 116 210 L 140 226" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 104 256 L 136 256" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 116 302 L 140 286" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <path d="M 396 210 L 372 226" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 408 256 L 376 256" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 396 302 L 372 286" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
